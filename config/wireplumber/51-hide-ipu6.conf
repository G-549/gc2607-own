# IPU6 exposes 48 raw ISYS capture nodes (6 CSI2 ports x 8 streams). Only the
# port the sensor is wired to can produce frames, so keep the others out of
# camera pickers. Matched on the PCI bus path of the IPU; the v4l2loopback
# virtual camera is on a different bus path and stays visible.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name = "~v4l2_device.pci-0000_00_05.0.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
